[project]
name = "order-mcp-server"
version = "0.1.0"
description = "订单查询 MCP 服务（从 agent-py 的 OrderAgent 剥离出来的独立服务）"
requires-python = ">=3.12"
dependencies = [
    # 官方 MCP Python SDK（v2），uvicorn/starlette 等由 mcp 传递依赖
    "mcp>=2.1.1",
]

# 安装后可直接用 `order-mcp` 命令启动
[project.scripts]
order-mcp = "order_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["order_mcp"]
